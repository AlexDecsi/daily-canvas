<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Sample illustration: floating solar panels in a harbor at sunset">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3a67"/><stop offset=".55" stop-color="#e8735a"/><stop offset="1" stop-color="#f7c873"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e6f86"/><stop offset="1" stop-color="#0d2f45"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d5a9e"/><stop offset="1" stop-color="#1b2d5c"/></linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#sky)"/>
  <circle cx="860" cy="430" r="110" fill="#ffd98a" opacity=".95"/>
  <g fill="#3a2f4f" opacity=".85">
    <rect x="60" y="330" width="70" height="190"/><rect x="140" y="280" width="90" height="240"/><rect x="240" y="360" width="60" height="160"/>
    <rect x="310" y="300" width="80" height="220"/><polygon points="400,520 400,250 430,220 460,250 460,520"/><rect x="470" y="380" width="110" height="140"/>
  </g>
  <g fill="#ffe7a8" opacity=".7">
    <rect x="160" y="300" width="10" height="14"/><rect x="190" y="330" width="10" height="14"/><rect x="330" y="320" width="10" height="14"/><rect x="350" y="360" width="10" height="14"/><rect x="80" y="360" width="10" height="14"/>
  </g>
  <rect y="520" width="1200" height="380" fill="url(#sea)"/>
  <g stroke="#ffd98a" stroke-width="4" opacity=".5"><line x1="780" y1="545" x2="940" y2="545"/><line x1="800" y1="575" x2="920" y2="575"/><line x1="820" y1="610" x2="900" y2="610"/></g>
  <g id="row">
    <polygon points="0,0 120,0 150,40 30,40" fill="url(#panel)" stroke="#9fb6e8" stroke-width="2"/>
    <line x1="40" y1="0" x2="70" y2="40" stroke="#9fb6e8" stroke-width="1.5"/><line x1="80" y1="0" x2="110" y2="40" stroke="#9fb6e8" stroke-width="1.5"/>
    <line x1="15" y1="20" x2="135" y2="20" stroke="#9fb6e8" stroke-width="1.5"/>
    <rect x="25" y="40" width="130" height="8" fill="#e9e4d8"/>
  </g>
  <g transform="translate(250 640)"><use href="#row"/><use href="#row" x="170"/><use href="#row" x="340"/><use href="#row" x="510"/></g>
  <g transform="translate(180 720) scale(1.15)"><use href="#row"/><use href="#row" x="170"/><use href="#row" x="340"/><use href="#row" x="510"/><use href="#row" x="680"/></g>
  <g transform="translate(90 815) scale(1.3)"><use href="#row"/><use href="#row" x="170"/><use href="#row" x="340"/><use href="#row" x="510"/><use href="#row" x="680"/></g>
  <path d="M1000 600 l60 0 l-10 20 l-45 0 z" fill="#f2efe6"/><line x1="1030" y1="600" x2="1030" y2="545" stroke="#f2efe6" stroke-width="3"/><polygon points="1032,548 1032,595 1065,595" fill="#f2efe6"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3"><rect x="24" y="24" width="120" height="40" rx="4" fill="#fff" opacity=".85"/><text x="84" y="52" text-anchor="middle" fill="#9a3b1f">SAMPLE</text></g>
</svg>
