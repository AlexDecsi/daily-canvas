<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Trump, Xi and Putin hold their first three-way meeting</title><desc id="d">Editorial illustration. Three leaders in dark suits stride side by side across a warm floor toward a bright open doorway: Donald Trump with swept blond hair and a long red tie, Xi Jinping at the centre, and Vladimir Putin, shorter with thinning light hair. Behind them rises a towering, nearly blank sheet of paper with four short ruled blocks, a symbolic stand-in for their joint declaration; their long shadows trail behind them, and silhouetted photographers in the foreground fire flashes. Represents the first three-way meeting of Trump, Xi and Putin in Shenzhen on Nov. 19, 2026, which produced a four-point 'peace' declaration.</desc><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer ><feFuncA type="linear" slope="0.6"/></feComponentTransfer></filter><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c4f"/><stop offset="1" stop-color="#2a3c9c"/></linearGradient><linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6a440"/><stop offset="1" stop-color="#9b5a2a"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4ecd9"/><stop offset="1" stop-color="#ddd0b2"/></linearGradient><linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.6"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd890" stop-opacity="0.8"/><stop offset="0.5" stop-color="#ffb534" stop-opacity="0.2"/><stop offset="1" stop-color="#ffb534" stop-opacity