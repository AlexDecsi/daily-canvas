<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Daily Canvas</title>
  <meta name="description" content="A gallery of daily news, one editorial illustration per day.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#archive">Skip to archive</a>

  <header class="site-header">
    <h1 class="site-title">The Daily Canvas</h1>
    <p class="site-tagline">One illustration of the day's news, every evening.</p>
  </header>

  <!-- Shown only while the gallery contains sample (non-real) entries. -->
  <p class="sample-banner" id="sample-banner" hidden>
    Prototype — every entry below is <strong>sample data</strong>, not real news.
  </p>

  <main>
    <section class="featured" id="featured" aria-label="Latest illustration">
      <p class="status-message">Loading gallery…</p>
    </section>

    <section class="archive" id="archive" aria-labelledby="archive-heading">
      <h2 id="archive-heading" class="section-label">Archive</h2>
      <ul class="grid" id="grid"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>Illustrations are editorial artwork, not photographs. Each entry links to its sources.</p>
  </footer>

  <dialog class="detail" id="detail" aria-labelledby="detail-title">
    <div class="detail-inner">
      <button class="detail-close" id="detail-close" type="button" aria-label="Close">×</button>
      <figure class="detail-figure">
        <div class="frame" id="detail-frame"></div>
        <figcaption class="label">
          <p class="label-date" id="detail-date"></p>
          <h2 class="label-title" id="detail-title"></h2>
          <p class="label-caption" id="detail-caption"></p>
          <p class="label-note" id="detail-note" hidden></p>
          <div class="label-sources" id="detail-sources"></div>
        </figcaption>
      </figure>
      <nav class="detail-nav" aria-label="Browse entries">
        <button type="button" id="detail-newer">← Newer</button>
        <button type="button" id="detail-older">Older →</button>
      </nav>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
