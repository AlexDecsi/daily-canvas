<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Studies Review</title>
<style>
  :root { --wall: #f4f1ea; --ink: #1f1d1a; --muted: #5f5a52; --mat: #fff; }
  @media (prefers-color-scheme: dark) { :root { --wall: #17161a; --ink: #ece8e1; --muted: #a9a399; --mat: #222027; } }
  body { margin: 0; background: var(--wall); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-family: Georgia, serif; font-weight: 400; }
  figure { margin: 0 0 48px; }
  .frame { background: var(--mat); padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.1); }
  img { display: block; width: 100%; height: auto; }
  figcaption { color: var(--muted); margin-top: 8px; font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>Phase 2 art studies</h1>
  <p>These are art studies. The scenes are made up, though they show real places and kinds of events.</p>
  <figure><div class="frame"><img src="01-un-dusk.svg" alt="United Nations Secretariat at dusk across the East River"></div>
    <figcaption>1 · International/political: an evening session at the United Nations.</figcaption></figure>
  <figure><div class="frame"><img src="02-launch.svg" alt="Rocket lifting off from a coastal launch pad watched from a beach"></div>
    <figcaption>2 · Science/technology: a crewed rocket launch from the Florida coast.</figcaption></figure>
  <figure><div class="frame"><img src="03-hurricane.svg" alt="Hurricane seen from orbit approaching a coastline at night"></div>
    <figcaption>3 · Environment: a hurricane nearing the coast, seen from orbit.</figcaption></figure>
</main>
</body>
</html>
