# Publishes the gallery (the public/ folder) to GitHub Pages whenever it changes on main.
# Approved by the owner on 2026-10-25. It only copies files; it doesn't run Claude or research.
name: Publish gallery

on:
  push:
    branches: [main]
    paths: ["public/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
